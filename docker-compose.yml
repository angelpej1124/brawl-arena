# 시놀로지 Container Manager → 프로젝트 → 생성 에서 이 파일을 그대로 씀
# 접속: http://NAS주소:8580 (럭키 체스는 그 안의 상점 밑 "미니게임" 메뉴)
# NAS에서 이미 쓰는 포트와 겹치면 .env의 BRAWL_PORT 를 다른 숫자로 바꾸기
# 비밀 값(DATABASE_URL 등)은 같은 폴더의 .env 파일에 넣기 (.env.example 참고)
services:
  brawl:
    build: .
    image: brawl-arena:latest
    container_name: brawl-arena
    restart: unless-stopped
    ports:
      - "${BRAWL_PORT:-8580}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_NICKS: ${ADMIN_NICKS:-}
    volumes:
      - ./data:/app/data
